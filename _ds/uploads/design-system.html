<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Illuminate Studios — Design System</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" />

  <link rel="stylesheet" href="src/styles/styles.css" />
  <link rel="stylesheet" href="src/styles/ds-styles.css" />
</head>
<body style="background-color: rgb(254, 252, 248)">
  <div id="root"></div>

  <!-- Interaction lock (mirrors the portal). -->
  <script>
    (function () {
      document.addEventListener('contextmenu', function (e) { e.preventDefault(); }, { capture: true });
      document.addEventListener('selectstart', function (e) {
        var t = e.target;
        if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
        e.preventDefault();
      }, { capture: true });
      document.addEventListener('dragstart', function (e) {
        if (e.target && e.target.tagName === 'IMG') e.preventDefault();
      }, { capture: true });
    })();
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
          integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
          crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
          integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
          crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
          integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
          crossorigin="anonymous"></script>

  <!-- Shared portal components (for live previews) -->
  <script type="text/babel" data-presets="env,react" src="src/components/components.jsx"></script>

  <!-- Design system page chunks -->
  <script type="text/babel" data-presets="env,react" src="src/design-system/ds-shell.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="src/design-system/ds-foundations.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="src/design-system/ds-components.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="src/design-system/ds-patterns.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="src/design-system/ds-handoff.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="src/design-system/ds-app.jsx"></script>
</body>
</html>
