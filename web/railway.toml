# INFRA — web service Root Directory: / ; Config File: /web/railway.toml
# Caddy serves the built SPA and proxies /api to API_UPSTREAM at runtime.
[build]
builder = "DOCKERFILE"
dockerfilePath = "web/Dockerfile"

[deploy]
numReplicas = 1
sleepApplication = false
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
