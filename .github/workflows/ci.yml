# INFRA — Continuous integration for the studio-suite monorepo.
# Reviewed as infrastructure, not application code.
#
# Backend and browser verification use isolated MongoDB 7.0.16 replica-set
# containers (transaction infrastructure).

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=phase3
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Start isolated MongoDB 7.0.16 replica set
        run: bash tests/start_mongodb.sh

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies (prod + dev)
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -q

  web:
    name: web (eslint + build + browser regressions)
    # Pinned: the browser fixtures use Playwright 1.58.0, which supports Chromium
    # on Ubuntu 24.04 but not on the 26.04 image ubuntu-latest now resolves to.
    runs-on: ubuntu-24.04
    env:
      BROWSER_MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=phase3
    # Runs from the repo ROOT: this is now a pnpm workspace, so the install must
    # resolve all members (packages/* + web) from the root lockfile.
    steps:
      - uses: actions/checkout@v4

      - name: Start isolated MongoDB 7.0.16 replica set
        run: bash backend/tests/start_mongodb.sh

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies (workspace, frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build workspace (tokens then web)
        run: pnpm build

      - name: Token authority and historical API contracts
        run: |
          node scripts/check-design.mjs
          node scripts/check-token-compatibility.mjs
          node scripts/check-hero-reference.mjs
          node scripts/check-marketing-reference.mjs

      - name: Mobile app typecheck (native token consumer)
        run: pnpm -F @illuminate/mobile typecheck

      - name: Mobile bookkeeping engine checks
        run: pnpm -F @illuminate/mobile exec node e2e/finance.js

      - name: Lint (eslint)
        run: pnpm lint:web

      - name: Set up Python 3.11 for browser fixtures
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install browser fixture dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Design source integrity (SHA-256 and archive CRC)
        run: python scripts/audit-design-source.py

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Production-built gallery theme lifecycle
        run: python web/tests/gallery_theme.py

      - name: Production-built portal shell matrix and navigation lifecycle
        env:
          PORTAL_TEST_ARTIFACTS: ${{ github.workspace }}/work/c1-b-browser/portal-shell
        run: python web/tests/portal_shell.py

      - name: All application browser regressions against local replica-set fixtures
        env:
          ENTRY_TEST_ARTIFACTS: ${{ github.workspace }}/work/c1-b-browser
        run: python web/tests/run_browser.py

      - name: Retain gallery lifecycle artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-theme-lifecycle
          path: work/c1-b-browser

  production-web:
    name: production web image and routing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the deployable image
        run: docker build --tag studio-suite-web:test --file web/Dockerfile .
      - name: Verify SPA, assets and credentialed API proxy
        run: python web/tests/production_server.py --image studio-suite-web:test

  infrastructure:
    name: R0 standard-library infrastructure tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Supervisor, protocol, isolation and gate negative tests
        run: python3 -B -m unittest discover -s scripts/autonomous/tests -v
