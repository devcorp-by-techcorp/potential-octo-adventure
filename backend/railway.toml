# INFRA — Root Directory: /backend; Config File: /backend/railway.toml.
# Reviewed as infrastructure, not application code.

[build]
builder = "RAILPACK"
buildEnvironment = "V3"

[deploy]
runtime = "V2"
numReplicas = 1
startCommand = "python deploy_server.py"
# Read-only release gate; provision the selected database explicitly beforehand.
preDeployCommand = "python initialize_database.py --check"
healthcheckPath = "/api/ready"
healthcheckTimeout = 120
sleepApplication = false
useLegacyStacker = false
ipv6EgressEnabled = true
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
